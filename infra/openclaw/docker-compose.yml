services:
  openclaw-gateway:
    image: ${OPENCLAW_IMAGE:?Set an audited, pinned OpenClaw image tag}
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      OPENCLAW_MODEL: ${OPENCLAW_MODEL:-}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      OPENCLAW_DISABLE_BONJOUR: "1"
      TZ: ${OPENCLAW_TZ:-UTC}
    volumes:
      - ${OPENCLAW_CONFIG_DIR:?Set a dedicated config directory}:/home/node/.openclaw
      - ${OPENCLAW_AUTH_PROFILE_SECRET_DIR:?Set a dedicated auth-secret directory}:/home/node/.config/openclaw
    ports:
      - 127.0.0.1:${OPENCLAW_GATEWAY_PORT:-18789}:18789
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    command: ["node", "dist/index.js", "gateway", "--bind", "lan", "--port", "18789"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18789/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  studio-bridge:
    build:
      context: ./bridge
    restart: unless-stopped
    init: true
    environment:
      OPENCLAW_BRIDGE_PORT: 8787
      OPENCLAW_BRIDGE_RPM: ${OPENCLAW_BRIDGE_RPM:-20}
      OPENCLAW_BRIDGE_TOKEN: ${OPENCLAW_BRIDGE_TOKEN:-}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      OPENCLAW_MODEL: ${OPENCLAW_MODEL:-}
      OPENCLAW_INTERNAL_URL: http://openclaw-gateway:18789
    ports:
      - 127.0.0.1:${OPENCLAW_BRIDGE_PORT:-8787}:8787
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      openclaw-gateway:
        condition: service_healthy

  openclaw-setup:
    image: ${OPENCLAW_IMAGE:?Set an audited, pinned OpenClaw image tag}
    profiles: ["setup"]
    env_file:
      - path: .env
        required: false
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      OPENCLAW_MODEL: ${OPENCLAW_MODEL:-}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
    volumes:
      - ${OPENCLAW_CONFIG_DIR:?Set a dedicated config directory}:/home/node/.openclaw
      - ${OPENCLAW_AUTH_PROFILE_SECRET_DIR:?Set a dedicated auth-secret directory}:/home/node/.config/openclaw
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    entrypoint: ["node", "dist/index.js"]

  openclaw-cli:
    image: ${OPENCLAW_IMAGE:?Set an audited, pinned OpenClaw image tag}
    profiles: ["cli"]
    network_mode: "service:openclaw-gateway"
    env_file:
      - path: .env
        required: false
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      OPENCLAW_MODEL: ${OPENCLAW_MODEL:-}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
    volumes:
      - ${OPENCLAW_CONFIG_DIR}:/home/node/.openclaw
      - ${OPENCLAW_AUTH_PROFILE_SECRET_DIR}:/home/node/.config/openclaw
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    entrypoint: ["node", "dist/index.js"]
    depends_on:
      openclaw-gateway:
        condition: service_healthy
